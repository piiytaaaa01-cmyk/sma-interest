
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - SMA INTEREST</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #159cff, #0874c9);
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .register-box h2 {
            text-align: center;
            color: #168bd2;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #168bd2;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #168bd2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0874c9;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .login-link a {
            color: #168bd2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>Daftar Akun</h2>

        <p class="subtitle">
            Buat akun SMA INTEREST untuk memulai
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimal 6 karakter"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input
                    type="password"
                    id="konfirmasiPassword"
                    placeholder="Ulangi password"
                    required
                >
            </div>

            <button type="submit" id="daftarBtn">
                Daftar Sekarang
            </button>

            <p id="message"></p>

        </form>

        <div class="login-link">
            Sudah punya akun?
            <a href="index.html">Login di sini</a>
        </div>

    </div>

    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from
        "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";


        // KONFIGURASI FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBTM0SE_fREOK5KRMQoSHC0sEUcIrhBIqg",
            authDomain: "sma-interest.firebaseapp.com",
            projectId: "sma-interest",
            storageBucket: "sma-interest.firebasestorage.app",
            messagingSenderId: "831507310144",
            appId: "1:831507310144:web:297d20f89d4005256ea1a5",
            measurementId: "G-RE2N85H139"
        };


        // INISIALISASI FIREBASE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        // FORM PENDAFTARAN
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const daftarBtn = document.getElementById("daftarBtn");


        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const nama = document.getElementById("nama").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const konfirmasi = document.getElementById("konfirmasiPassword").value;


            // CEK PASSWORD
            if (password !== konfirmasi) {
                message.style.color = "red";
                message.textContent = "Konfirmasi password tidak cocok!";
                return;
            }


            daftarBtn.disabled = true;
            daftarBtn.textContent = "Memproses...";
            message.textContent = "";


            try {

                // MEMBUAT AKUN FIREBASE
                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                // MENYIMPAN NAMA PENGGUNA
                await updateProfile(userCredential.user, {
                    displayName: nama
                });


                message.style.color = "green";
                message.textContent = "Pendaftaran berhasil! Silakan login.";

                form.reset();


                // KEMBALI KE HALAMAN LOGIN
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);


            } catch (error) {

                message.style.color = "red";

                if (error.code === "auth/email-already-in-use") {
                    message.textContent = "Email sudah terdaftar!";
                } else if (error.code === "auth/weak-password") {
                    message.textContent = "Password minimal 6 karakter!";
                } else if (error.code === "auth/invalid-email") {
                    message.textContent = "Format email tidak valid!";
                } else if (error.code === "auth/api-key-not-valid") {
                    message.textContent = "API Key Firebase tidak valid. Periksa konfigurasi Firebase.";
                } else {
                    message.textContent = "Pendaftaran gagal: " + error.message;
                }

            } finally {

                daftarBtn.disabled = false;
                daftarBtn.textContent = "Daftar Sekarang";

            }

        });

    </script>

</body>
</html>
